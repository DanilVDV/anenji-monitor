name: Bootstrap current source

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild v2.11.26 source
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, shutil

          parts = sorted(Path('.bootstrap').glob('anenji_web.py.gz.b64.part*'))
          assert len(parts) == 4, f'expected 4 payload parts, got {len(parts)}'
          payload = ''.join(p.read_text(encoding='ascii') for p in parts)
          source = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(source).hexdigest()
          expected = '94dca1911bc9d28e206ff1901cafc544f25ec9a1a3a6b622ea558783af7cf911'
          assert digest == expected, f'source sha256 mismatch: {digest}'

          Path('anenji_web.py').write_bytes(source)
          Path('archive').mkdir(exist_ok=True)
          Path('archive/anenji_web_v2.11.26_attention_grid_option.py').write_bytes(source)

      - name: Remove bootstrap payload and commit source
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Anenji monitor v2.11.26 source"
          git push
